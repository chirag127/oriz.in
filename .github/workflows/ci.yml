name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Type check, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: dist/build-report.json
          if-no-files-found: error

  browser-qa:
    name: Edge browser QA
    runs-on: windows-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build:fast
      - name: Browser QA with Microsoft Edge
        run: node scripts/run-browser-qa.mjs
      - name: CSP and security-header check with Microsoft Edge
        run: node scripts/check-csp.mjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: |
            .scratch/browser-report.json
            .scratch/csp-report.json
            .scratch/screens/
          if-no-files-found: warn
